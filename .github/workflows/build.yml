name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      variant:
        description: '构建变体'
        required: true
        default: 'fdroidRelease'
        type: choice
        options:
          - fdroidRelease
          - playRelease
          - debug
      minify:
        description: '代码压缩 (minify)'
        required: true
        default: 'off'
        type: choice
        options:
          - off
          - on

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VARIANT: ${{ github.event.inputs.variant || 'fdroidRelease' }}
      MINIFY: ${{ github.event.inputs.minify || 'off' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0" || true
      - name: Build release APK
        env:
          nkmr_minify: "${{ env.MINIFY == 'on' && '1' || '0' }}"
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ "$VARIANT" = "fdroidRelease" ]; then TASK=:app:assembleFdroidRelease; fi
          if [ "$VARIANT" = "playRelease" ]; then TASK=:app:assemblePlayRelease; fi
          if [ "$VARIANT" = "debug" ]; then TASK=:app:assembleFdroidDebug; fi
          ./gradlew $TASK -x lintVitalAnalyzeFdroidRelease -x lintVitalAnalyzeRelease -x :vpnhotspot:lintVitalAnalyzeRelease --console=plain -Dorg.gradle.jvmargs="-Xmx4g"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zybox-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
